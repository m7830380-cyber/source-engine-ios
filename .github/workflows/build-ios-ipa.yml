name: Build iOS IPA

on:
  push:
    branches: [ master, main, csgo-ios ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-14
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ccache
        run: brew install ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-csgo-ios-${{ github.sha }}
          restore-keys: ccache-csgo-ios-

      - name: Build unsigned IPA
        env:
          IOS_BUNDLE_ID: com.sourceengine.csgo
          IOS_DISPLAY_NAME: csgo-source
          IOS_APP_BUNDLE: csgo.app
          IOS_IPA_NAME: source-engine-csgo-ios-arm64.ipa
          # keep going after errors so each run reports every failing file
          WAF_BUILD_FLAGS: -k
        run: |
          chmod +x scripts/build-ios-arm64.sh scripts/ios/*.sh
          ./scripts/build-ios-arm64.sh --use-ccache

      - name: Compiler cache stats
        if: always()
        run: ccache -s || true

      # saved even when the build fails, so the next iteration only
      # recompiles what changed
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-csgo-ios-${{ github.sha }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-engine-csgo-ios-arm64
          path: artifacts/source-engine-csgo-ios-arm64.ipa
          if-no-files-found: error
