name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-14
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # TF2-only until the IPA is green.
          - game: tf
            bundle_id: com.sourceengine.tf
            display_name: tf-source
            app_bundle: tf.app
            artifact: source-engine-tf-ios-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build unsigned IPA
        env:
          IOS_GAME: ${{ matrix.game }}
          IOS_BUNDLE_ID: ${{ matrix.bundle_id }}
          IOS_DISPLAY_NAME: ${{ matrix.display_name }}
          IOS_APP_BUNDLE: ${{ matrix.app_bundle }}
          IOS_IPA_NAME: ${{ matrix.artifact }}.ipa
        run: |
          chmod +x scripts/build-ios-arm64.sh scripts/ios/*.sh
          ./scripts/build-ios-arm64.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.ipa
          if-no-files-found: error
