name: Weapon/skin shaders (.vcs)

# Recompiles the skin shaders from this tree's .fxc sources
# (scripts/shaders/vcscompile.py: combo math from fxctmp9/*.inc, one fxc.exe
# run per combo, packed into Valve's .vcs format), one job per shader, and
# packs them as platform/shaders/fxc/*.vcs in a single zip artifact.
#
#   customweapon     - skin paint compositing
#   weapondecal      - stickers
#   customcharacter  - glove paint compositing
#
# The model shaders (phong, vertexlit_and_unlit_generic) are not here: they
# have 10^8..10^10 combos, far beyond fxc-per-combo on a CI runner (Valve used
# a compile farm), and the retail ones work.

on:
  workflow_dispatch:
    inputs:
      jobs_per_shader:
        description: "Parallel fxc.exe processes per shader job"
        required: true
        default: "4"
  push:
    paths:
      - 'scripts/shaders/**'
      - '.github/workflows/build-weapon-shaders.yml'

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: customweapon_ps20b.fxc,                 target: customweapon_ps20b }
          - { src: customweapon_ps20b.fxc,                 target: customweapon_ps30 }
          - { src: customweapon_vs20.fxc,                  target: customweapon_vs20 }
          - { src: customweapon_vs20.fxc,                  target: customweapon_vs30 }
          - { src: weapondecal_ps20b.fxc,                  target: weapondecal_ps20b }
          - { src: weapondecal_ps20b.fxc,                  target: weapondecal_ps30 }
          - { src: weapondecal_vs20.fxc,                   target: weapondecal_vs20 }
          - { src: weapondecal_vs20.fxc,                   target: weapondecal_vs30 }
          - { src: customcharacter_ps30.fxc,               target: customcharacter_ps30 }
          - { src: customcharacter_vs30.fxc,               target: customcharacter_vs30 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The DirectX SDK (June 2010) fxc.exe is the compiler Valve's shaders were
      # built with. If it can't be fetched, fall back to the Windows SDK's fxc
      # in backwards-compatibility mode.
      - name: Get fxc.exe
        shell: pwsh
        run: |
          $fxc = $null
          try {
            Invoke-WebRequest -Uri "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe" -OutFile dxsdk.exe
            7z x dxsdk.exe -odxsdk -r -y fxc.exe "Jun2010_D3DCompiler_43_x86.cab" "Jun2010_D3DCompiler_43_x64.cab" "Jun2010_d3dx9_43_x86.cab" "Jun2010_d3dx9_43_x64.cab" | Out-Null
            foreach ($arch in @('x86', 'x64')) {
              $cand = Get-ChildItem dxsdk -Recurse -Filter fxc.exe | Where-Object { $_.FullName -match "\\$arch\\" } | Select-Object -First 1
              if (-not $cand) { Write-Host "no $arch fxc.exe in the SDK"; continue }
              $dir = $cand.DirectoryName
              # fxc.exe needs D3DCompiler_43.dll and D3DX9_43.dll next to it
              foreach ($name in @("Jun2010_D3DCompiler_43_$arch.cab", "Jun2010_d3dx9_43_$arch.cab")) {
                $cab = Get-ChildItem dxsdk -Recurse -Filter $name | Select-Object -First 1
                if ($cab) { 7z e $cab.FullName "-o$dir" -y *.dll | Out-Null }
              }
              Write-Host "$arch fxc: $($cand.FullName)"
              Get-ChildItem $dir -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
              # fxc /? exits nonzero; judge it by its banner
              $banner = (& $cand.FullName /? 2>&1 | Out-String)
              Write-Host "  exit code $LASTEXITCODE; banner: $(($banner.Trim() -split "`n")[0])"
              if ($banner -match 'Shader Compiler') { $fxc = $cand.FullName; break }
            }
          } catch { Write-Host "DirectX SDK fxc unavailable: $_" }

          if (-not $fxc) {
            $cand = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                    Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            $fxc = $cand.FullName
            "VCS_FXC_EXTRA=/Gec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Using Windows SDK fxc with /Gec"
          }
          Write-Host "fxc: $fxc"
          "FXC_EXE=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # pwsh steps otherwise exit with the last native command's exit code
          exit 0

      - name: Compile ${{ matrix.target }}
        shell: pwsh
        run: |
          $jobs = "${{ github.event.inputs.jobs_per_shader }}"
          if (-not $jobs) { $jobs = "4" }
          python scripts/shaders/vcscompile.py compile "${{ matrix.src }}" "${{ matrix.target }}" --fxc "$env:FXC_EXE" --jobs $jobs --out shaderout
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/shaders/vcscompile.py verify "shaderout/shaders/fxc/${{ matrix.target }}.vcs"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: vcs-${{ matrix.target }}
          path: shaderout/shaders/fxc/${{ matrix.target }}.vcs
          if-no-files-found: error

  pack:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vcs-*
          path: parts
          merge-multiple: true

      - name: Lay out as platform/shaders/fxc
        run: |
          mkdir -p out/platform/shaders/fxc
          cp parts/*.vcs out/platform/shaders/fxc/
          ls -la out/platform/shaders/fxc

      # The downloaded artifact is the zip: extract it over the game folder
      # (the one that has platform/ and csgo/ in it).
      - uses: actions/upload-artifact@v4
        with:
          name: weapon-skin-shaders
          path: out
          if-no-files-found: error
